# Weekly dependency updates, grouped so that each week brings at most a few
# pull requests. The CI checks them like any change; nothing merges by itself.
# libmpv is pinned in scripts/get-libmpv.py and moved by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # typescript-eslint does not support TypeScript 7 yet: its update cannot
      # install. Remove once typescript-eslint's peer range allows it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
